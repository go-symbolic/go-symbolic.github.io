baseURL = 'https://go-symbolic.github.io/'
locale  = 'en-us'
title   = 'go-symbolic'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html, and the shared design (styles, theme toggle, fork ribbon,
# icons) imported as the Hugo module github.com/go-fleettools/landingkit,
# pinned in go.mod.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-symbolic: computer algebra in pure Go (CGO=0), planned for wave 4 of the go-scikit roadmap. Expressions, polynomials, GCD and factorisation, Gröbner bases, differentiation, integration, series, limits and solving, and from Maple code generation to Go, algebraic numbers, ODE and PDE solving, triangular decomposition, differential algebra, symbolic random variables, permutation groups and tensors."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
[[params.repos]]
  name  = "core"
  kind  = "planned (wave 4)"
  href  = "https://go-symbolic.github.io/docs/latest/core/"
  blurb = "Planned (wave 4). Expression DAG, polynomials over Z, Q and F_p, GCD and factorisation, Gröbner bases, differentiation, integration (Hermite, Risch, Rubi rules), series and limits, exact linear algebra. Repository names are provisional."
[[params.repos]]
  name  = "maple"
  kind  = "planned (wave 4)"
  href  = "https://go-symbolic.github.io/docs/latest/maple/"
  blurb = "Planned (wave 4, after the core). Code generation to Go, algebraic numbers, ODE and PDE solving, triangular decomposition and CAD, differential algebra, symbolic random variables, permutation groups and tensors. Repository names are provisional."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-symbolic.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the scope, the plan and the references of each planned library. <a href=\"https://github.com/go-symbolic/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-symbolic/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The cards of #exact and their count come from this list. Each statement is
# from the roadmap's bibliography for this domain: a plan, not a result.
[[params.checks]]
  name = "Exact algebra"
  what = "Polynomials and exact linear algebra are checked by exact equality after a canonical form; factorisation by product equal to the input and irreducible factors; a reduced Gröbner basis is unique for an order, so it must equal the oracle's."
[[params.checks]]
  name = "Integration"
  what = "The derivative of the result minus the integrand must simplify to zero, and the Rubi suite (72,000+ problems) gives a grade histogram: A optimal, B larger, C, F failure."
[[params.checks]]
  name = "Code generation"
  what = "Generated Go compiles and passes `go vet`, equals the expression's interpreter on 1000 random points within a stated ULP bound, and uses no more operations after CSE than SymPy's `cse`."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 7.13:1, bright on the dark background 8.07:1.
  base = "#9810a4"
  deep = "#5d0a64"
  bright = "#d98ce0"
  shadow = "rgba(152,16,164,.7)"
  glow = "rgba(152,16,164,.6)"
  wash = "rgba(152,16,164,.10)"
  washDeep = "rgba(93,10,100,.06)"
  chipBg = "#faf1fb"
  chipBorder = "#f4dcf6"
  chipFg = "#5d0a64"
  chipBgDark = "rgba(217,140,224,.14)"
  chipBorderDark = "rgba(217,140,224,.32)"
  chipFgDark = "#eac0ee"
  statsEnd = "#f6e3f8"
  bandText = "#f9edfa"
